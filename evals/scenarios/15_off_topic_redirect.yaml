id: off_topic_redirect
title: Caller asks about weather and sports, then gets back on topic and asks Friday closing time
category: off_topic
reviewed: true
persona: Pete Novak, chatty and bored, drifts off topic. He asks the weather and sports question, then once redirected asks only what time the clinic closes on Fridays, says thanks and hangs up. He asks nothing else.
goal: Chat, then find out when the clinic closes on Fridays.
opening_message: What's the weather going to be like this weekend? And who do you think wins the game tonight?
script:
  - Okay fine. What time do you close on Fridays?
setup: {}
expect:
  tools_in_order: [faq_lookup]
  forbidden_tools: [book_appointment, transfer_call]
  max_tool_calls: 1
  final_state: {faq_topics: [hours], bookings_active: 0}
  reply_must_match:
    - '(?i)appointment|our (office|clinic)|the (office|clinic)'
  reply_must_not_match:
    - '(?i)\b(sunny|rain|forecast|degrees|will win|good chance)\b'
reference:
  - say: "{{GREETING}}"
  - say: I can only help with the clinic, like appointments and questions about our office. What can I help you with?
  - tool: faq_lookup
    args: {question: Friday closing time}
  - say: On Fridays we close at one in the afternoon. Anything else?
